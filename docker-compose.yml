services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-sildemar}
      DB_PASS: ${DB_PASS:-sildemar_pass}
      DB_NAME: ${DB_NAME:-sildemar}
    depends_on:
      - db
      - mailhog

  nginx:
    image: nginx:1.26-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:5.7
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-sildemar}
      MYSQL_USER: ${DB_USER:-sildemar}
      MYSQL_PASSWORD: ${DB_PASS:-sildemar_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/sildemar_db.sql:/docker-entrypoint-initdb.d/sildemar_db.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-sildemar}
      PMA_PASSWORD: ${DB_PASS:-sildemar_pass}
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
