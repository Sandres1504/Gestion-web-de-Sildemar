<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Empleado - Sildemar</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="sidebar">

        <h2>SILDEMAR</h2>

        <a href="#"><i class="fas fa-home"></i> Mi Panel</a>

        <a href="inventario.html">
            <i class="fas fa-boxes"></i> Ver Inventario
        </a>

        <a href="nueva_solicitud.html">
            <i class="fas fa-plus-circle"></i> Nueva Solicitud
        </a>

        <a href="mis_solicitudes.html">
            <i class="fas fa-shopping-cart"></i> Mis Solicitudes
        </a>

        <a href="perfil.html">
            <i class="fas fa-user-edit"></i> Mi Perfil
        </a>

        <a href="#" id="logout-btn" style="margin-top:40px;background:#c0392b;">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>

    </div>

    <div class="main-content">

        <header>
            <h1>Panel del Empleado</h1>

            <div>
                <i class="fas fa-user-circle"></i>
                <span id="user-info"></span>
            </div>
        </header>

        <div class="cards">

            <div class="card">
                <h3>🛒 Solicitudes Pendientes</h3>
                <p id="stat-pendientes">...</p>
            </div>

            <div class="card">
                <h3>📦 Total Productos</h3>
                <p id="stat-productos">...</p>
            </div>

            <div class="card">
                <h3>💱 Tasa de Cambio (BCV)</h3>
                <p id="stat-tasa">...</p>
            </div>

        </div>

        <div class="actividad-box">

            <h3>Distribución del Inventario</h3>

            <canvas id="actividadChart"></canvas>

        </div>

    </div>

    <script>

        /* SEGURIDAD */


        async function applySecurity() {

            const userData = JSON.parse(localStorage.getItem('usuario_actual'))
            const userRole = String(userData?.rol || '').trim().toLowerCase();

            if (!userData || userRole !== 'empleado') {
                window.location.href = "../index.html"
                return
            }

            document.getElementById('user-info').innerText =
                `${userData.nombre} (Empleado)`

            // Verificar si es el primer inicio de sesión
            if (userData.primer_login === 1) {
                Swal.fire({
                    title: '¡Aviso de Seguridad!',
                    text: 'Es tu primera vez en el sistema. Tu contraseña actual no es segura. Por favor, cámbiala en tu perfil.',
                    icon: 'warning',
                    confirmButtonText: 'Ir a Mi Perfil',
                    confirmButtonColor: '#3B7BC0',
                    allowOutsideClick: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = 'perfil.html';
                    }
                });

                // Actualizamos el objeto local para que no vuelva a salir en esta sesión
                userData.primer_login = 0;
                localStorage.setItem('usuario_actual', JSON.stringify(userData));
            }

            try {
                const response = await fetch('../backend/dashboard.php', { credentials: 'same-origin' });
                const result = await response.json();

                if (result.success) {
                    // Actualizar tarjetas por ID (ya existen en el HTML)
                    document.getElementById('stat-pendientes').innerText = result.metrics.pendientes;
                    document.getElementById('stat-productos').innerText = result.metrics.productos;
                    document.getElementById('stat-tasa').innerText = `Bs. ${parseFloat(result.metrics.tasa_dolar).toFixed(2)}`;

                    const ctx = document.getElementById('actividadChart')
                    
                    const marcasLabels = result.grafico ? result.grafico.map(g => g.marca) : ['Sin Datos'];
                    const marcasStock = result.grafico ? result.grafico.map(g => g.cantidad) : [0];

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: marcasLabels,
                            datasets: [{
                                label: 'Stock por Categoría',
                                data: marcasStock,
                                backgroundColor: '#004080'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Marcas de Repuestos',
                                        color: '#3B7BC0',
                                        font: { weight: 'bold' }
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'Cantidad en Stock',
                                        color: '#3B7BC0',
                                        font: { weight: 'bold' }
                                    },
                                    beginAtZero: true
                                }
                            }
                        }
                    })
                }
            } catch (e) {
                console.error("Error cargando dashboard empleado", e);
            }

        }

        /* LOGOUT */

        document.getElementById('logout-btn').addEventListener('click', function (e) {

            e.preventDefault()

            localStorage.removeItem('usuario_actual')

            window.location.href = "../index.html"

        })

        window.onload = applySecurity

    </script>

</body>

</html>
