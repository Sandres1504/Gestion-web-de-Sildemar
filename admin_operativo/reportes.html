<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Sildemar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

    <div class="sidebar" id="sidebar">
        <h2>SILDEMAR</h2>

        <a href="dashboard.html">
            <i class="fas fa-home"></i> Inicio
        </a>



        <a href="inventario.html">
            <i class="fas fa-boxes"></i> Inventario
        </a>

        <a href="solicitudes.html">
            <i class="fas fa-shopping-cart"></i> Solicitudes
        </a>


        <a href="historial_clientes.html">
            <i class="fas fa-users"></i> Historial Clientes
        </a>

        <a href="reportes.html">
            <i class="fas fa-file-pdf"></i> Reportes
        </a>

        <a href="perfil.html">
            <i class="fas fa-user-edit"></i> Mi Perfil
        </a>

        <a href="../index.html" class="btn-logout" id="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>
    </div>

    <div class="main-content">
        <header>
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <h1>Informes y Estadísticas</h1>
        </header>

        <!-- Tarjetas de Resumen Real -->
        <div class="cards">
            <div class="card">
                <i class="fas fa-exclamation-triangle"></i>
                Stock Crítico (< 5) <span class="card-value" id="stock-critico">Cargando...</span>
            </div>
            <div class="card">
                <i class="fas fa-money-bill-wave"></i>
                Valor de Inventario
                <span class="card-value" id="valor-inventario">Cargando...</span>
            </div>
            <div class="card">
                <i class="fas fa-box"></i>
                Total Productos
                <span class="card-value" id="total-productos">Cargando...</span>
            </div>
        </div>

        <div class="report-box">
            <h3><i class="fas fa-filter"></i> Generar Informes Detallados</h3>
            <div class="report-controls" style="display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;">
                <div class="filter-group" style="display:flex; gap:10px; flex:1;">
                    <div class="filter-item" style="flex:1;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Seleccionar Análisis</label>
                        <select id="tipo_reporte" onchange="actualizarHeaders()"
                            style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd; height:40px;">
                            <option value="inventario">Inventario Completo</option>
                            <option value="productos_top">Productos Más Vendidos (Mes)</option>
                            <option value="clientes_top">Clientes Destacados (Mes)</option>
                        </select>
                    </div>
                    <div class="filter-item" style="flex:1;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Filtro Secundario
                            (Marca/Nombre)</label>
                        <input type="text" id="filtro_marca" placeholder="Ej: Toyota"
                            style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd; height:40px; box-sizing:border-box;">
                    </div>
                </div>
                <div style="display:flex; gap:10px; height:40px;">
                    <button class="btn-export"
                        style="background: #3B7BC0; color: white; padding: 0 15px; border: none; border-radius: 6px; cursor: pointer; height:100%; display:flex; align-items:center; justify-content:center; gap:5px;"
                        onclick="generarReporte()">
                        <i class="fas fa-search"></i> Consultar
                    </button>
                    <button class="btn-green btn-export"
                        style="height:100%; display:flex; align-items:center; justify-content:center; gap:5px;"
                        onclick="exportarExcel()">
                        <i class="fas fa-file-excel"></i> Exportar
                    </button>
                    <button class="btn-export"
                        style="background: #e74c3c; color: white; padding: 0 15px; border: none; border-radius: 6px; cursor: pointer; height:100%; display:flex; align-items:center; justify-content:center; gap:5px;"
                        onclick="exportarPDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                </div>
            </div>

            <div id="reporte-resultados">
                <table id="tabla-reporte">
                    <thead id="headers-reporte"></thead>
                    <tbody id="body-reporte">
                        <tr>
                            <td colspan="5" style="text-align:center;">Haga clic en consultar para cargar datos</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); }

        let tasaDolarGlobal = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            applySecurity();

            try {
                const rateRes = await fetch('../backend/get_reportes.php?action=get_rate');
                const rateData = await rateRes.json();
                tasaDolarGlobal = parseFloat(rateData.tasa_dolar) || 1;
            } catch (e) { console.error("Error rate:", e); }

            cargarEstadisticas();
            generarReporte(); // Carga inicial
        });

        // Seguridad de roles
        function applySecurity() {
            const userData = JSON.parse(localStorage.getItem('usuario_actual'));
            if (!userData || userData.rol !== 'Gerente Operacional') {
                alert("Acceso denegado. Se requiere rol de Gerente Operacional.");
                window.location.href = "../index.html";
                return;
            }
            const roleDisplay = document.getElementById('user-role-display');
            if (roleDisplay) roleDisplay.innerText = `${userData.nombre || 'Usuario'} (${userData.rol})`;
        }

        // Cambia las cabeceras de la tabla según el reporte
        function actualizarHeaders() {
            const tipo = document.getElementById('tipo_reporte').value;
            const head = document.getElementById('headers-reporte');

            if (tipo === 'inventario') {
                head.innerHTML = `<tr><th>Producto</th><th>Marca</th><th>Stock</th><th>Precio Unit.</th><th>Valor Total</th></tr>`;
            } else if (tipo === 'productos_top') {
                head.innerHTML = `<tr><th>Producto</th><th>Marca</th><th>Cant. Vendida</th><th>Total Generado</th></tr>`;
            } else if (tipo === 'clientes_top') {
                head.innerHTML = `<tr><th>Cliente</th><th>Total Pedidos</th><th>Total Invertido</th></tr>`;
            }

            // Limpiar cuerpo al cambiar
            document.getElementById('body-reporte').innerHTML = "<tr><td colspan='10' style='text-align:center;'>Haga clic en consultar</td></tr>";
        }

        // Carga las 3 tarjetas superiores desde el backend
        async function cargarEstadisticas() {
            try {
                const response = await fetch('../backend/get_reportes.php?action=stats');
                const data = await response.json();

                if (!data.success && data.message) {
                    console.warn(data.message);
                    return;
                }

                const bsFactor = tasaDolarGlobal || 1;
                document.getElementById('stock-critico').innerText = data.critico + " items";

                const valorUsd = parseFloat(data.valor_inventario) || 0;
                document.getElementById('valor-inventario').innerHTML = `$${valorUsd.toFixed(2)} <br><small style="font-size:12px; color:#555;">(Bs ${(valorUsd * bsFactor).toFixed(2)})</small>`;

                document.getElementById('total-productos').innerText = data.total_productos + " SKU";
            } catch (e) {
                console.error("Error cargando estadísticas", e);
            }
        }

        // Genera la tabla de reporte filtrada
        async function generarReporte() {
            actualizarHeaders();
            const tipo = document.getElementById('tipo_reporte').value;
            const marca = document.getElementById('filtro_marca').value.toLowerCase();
            const body = document.getElementById('body-reporte');

            body.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Cargando datos...</td></tr>";

            try {
                const response = await fetch(`../backend/get_reportes.php?action=filter&tipo=${tipo}`);
                const data = await response.json();

                body.innerHTML = "";
                let filtrados = data;

                // Filtro manual de marca/nombre si el usuario escribió algo
                if (marca) {
                    filtrados = data.filter(p => {
                        const term = marca.toLowerCase();
                        if (tipo === 'clientes_top') {
                            return (p.cliente || "").toLowerCase().includes(term);
                        } else {
                            return (p.marca || "").toLowerCase().includes(term) ||
                                (p.nombre_producto || "").toLowerCase().includes(term);
                        }
                    });
                }

                if (filtrados.length === 0) {
                    body.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No se encontraron resultados</td></tr>";
                    return;
                }

                filtrados.forEach(p => {
                    const bsFactor = tasaDolarGlobal || 1;

                    if (tipo === 'inventario') {
                        const stock = parseInt(p.stock_actual);
                        const precio = parseFloat(p.precio) || 0;
                        body.innerHTML += `
                            <tr>
                                <td>${p.nombre_producto}</td>
                                <td>${p.marca}</td>
                                <td class="${stock < 5 ? 'badge-low' : ''}">${stock} uds</td>
                                <td>Bs ${(precio * bsFactor).toFixed(2)} <br><small style="color:#555">($${precio.toFixed(2)})</small></td>
                                <td>Bs ${(stock * precio * bsFactor).toFixed(2)} <br><small style="color:#555">($${(stock * precio).toFixed(2)})</small></td>
                            </tr>`;
                    } else if (tipo === 'productos_top') {
                        const ingr = parseFloat(p.ingresos) || 0;
                        body.innerHTML += `
                            <tr>
                                <td>${p.nombre_producto}</td>
                                <td>${p.marca}</td>
                                <td>${p.total_vendido}</td>
                                <td>$${ingr.toFixed(2)} <br><small style="color:#555">(Bs ${(ingr * bsFactor).toFixed(2)})</small></td>
                            </tr>`;
                    } else if (tipo === 'clientes_top') {
                        const gastado = parseFloat(p.total_gastado) || 0;
                        body.innerHTML += `
                            <tr>
                                <td>${p.cliente}</td>
                                <td>${p.cantidad_pedidos}</td>
                                <td>$${gastado.toFixed(2)} <br><small style="color:#555">(Bs ${(gastado * bsFactor).toFixed(2)})</small></td>
                            </tr>`;
                    }
                });
            } catch (e) {
                body.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Error al conectar con el servidor</td></tr>";
            }
        }

        function exportarExcel() {
            const tbody = document.getElementById('body-reporte');
            // Validar que la tabla de verdad tenga contenido y no un mensaje de carga
            if (tbody.innerText.includes("Cargando") || tbody.innerText.includes("Haga clic") || tbody.innerText.includes("No se encontraron")) {
                alert("No hay datos válidos para exportar en estos momentos.");
                return;
            }

            const userData = JSON.parse(localStorage.getItem('usuario_actual'));
            const userName = userData ? userData.nombre : 'Sistema';
            const userCode = userData ? (userData.cedula || userData.id_usuario) : 'N/A';
            const ahora = new Date();
            const fecha = ahora.toLocaleDateString();
            const hora = ahora.toLocaleTimeString();
            const nroControl = "REP-" + ahora.getTime();
            const tipo = document.getElementById('tipo_reporte').selectedOptions[0].text;

            // Definir encabezado de información
            const infoHeader = [
                ["SILDEMAR - RIF: J-30903326-3", "", "", "", `tasa de cambio (${tasaDolarGlobal.toFixed(2)})`],
                [`Tipo de Análisis: ${tipo}`],
                [`Generado por: ${userName}`],
                [`Código de Empleado: ${userCode}`],
                [`Nro. Control: ${nroControl}`],
                [`Fecha de Emisión: ${fecha}`],
                [`Hora de Emisión: ${hora}`],
                [] // Fila vacía separadora
            ];

            const tabla = document.querySelector("#reporte-resultados table");
            const ws = XLSX.utils.table_to_sheet(tabla);
            const dataTable = XLSX.utils.sheet_to_json(ws, { header: 1 });
            const finalData = infoHeader.concat(dataTable);

            const newWs = XLSX.utils.aoa_to_sheet(finalData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, newWs, "Reporte");

            XLSX.writeFile(wb, `Sildemar_${tipo.replace(/ /g, '_')}_${fecha}.xlsx`);
        }

        function exportarPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const userData = JSON.parse(localStorage.getItem('usuario_actual'));
                const userName = userData ? userData.nombre : 'Sistema';
                const userCode = userData ? (userData.cedula || userData.id_usuario) : 'N/A';
                const tipo = document.getElementById('tipo_reporte')?.selectedOptions[0]?.text || 'General';
                const ahora = new Date();
                const fecha = ahora.toLocaleDateString();
                const hora = ahora.toLocaleTimeString();
                const nroControl = "REP-" + ahora.getTime();

                // Logo de la empresa
                try { doc.addImage('logo.png', 'PNG', 14, 10, 25, 25); } catch (e) { console.warn("Logo no encontrado"); }

                doc.setFontSize(18);
                doc.text("Sildemar - Reporte Administrativo", 45, 20);
                doc.setFontSize(10);
                doc.text(`tasa de cambio (${tasaDolarGlobal.toFixed(2)})`, doc.internal.pageSize.width - 60, 20);
                doc.setFontSize(9);
                doc.text(`Tipo de reporte: ${tipo}`, 14, 50);

                // Clonar tabla y quitar columna de acciones (si existe)
                const tablaOriginal = document.getElementById("tabla-reporte");
                const tablaClone = tablaOriginal.cloneNode(true);

                tablaClone.querySelectorAll("tr").forEach(fila => {
                    if (fila.style.display === "none") {
                        fila.remove();
                    } else if (fila.lastElementChild && fila.lastElementChild.innerHTML.includes('btn')) {
                        fila.lastElementChild.remove();
                    }
                });

                // ========== LIMITAR FILAS POR PÁGINA ==========
                const FILAS_POR_PAGINA = 17;

                const tbody = tablaClone.querySelector('tbody');
                if (tbody) {
                    const filas = Array.from(tbody.querySelectorAll('tr'));
                    const totalFilas = filas.length;
                    const totalPaginas = Math.ceil(totalFilas / FILAS_POR_PAGINA);

                    if (totalFilas > FILAS_POR_PAGINA) {
                        tbody.innerHTML = '';

                        for (let pagina = 0; pagina < totalPaginas; pagina++) {
                            const inicio = pagina * FILAS_POR_PAGINA;
                            const fin = Math.min(inicio + FILAS_POR_PAGINA, totalFilas);
                            const filasPagina = filas.slice(inicio, fin);

                            filasPagina.forEach(fila => tbody.appendChild(fila.cloneNode(true)));

                            if (pagina < totalPaginas - 1) {
                                doc.autoTable({
                                    html: tablaClone,
                                    startY: 45,
                                    theme: 'striped',
                                    headStyles: { fillColor: [59, 123, 192] },
                                    didDrawPage: function (data) {
                                        const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                                        const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();

                                        doc.setFontSize(8);
                                        doc.setTextColor(100);
                                        doc.text(`Generado por: ${userName}`, pageWidth - 65, pageHeight - 25);
                                        doc.text(`Código: ${userCode}`, pageWidth - 65, pageHeight - 21);
                                        doc.text(`Nro. Control: ${nroControl}`, pageWidth - 65, pageHeight - 17);
                                        doc.text(`Fecha: ${fecha}`, pageWidth - 65, pageHeight - 13);
                                        doc.text(`Hora: ${hora}`, pageWidth - 65, pageHeight - 9);
                                    }
                                });

                                tbody.innerHTML = '';
                                doc.addPage();

                                // Re-dibujar cabecera en nueva página
                                doc.setFontSize(18);
                                doc.text("Sildemar - Reporte Administrativo", 45, 20);
                                doc.setFontSize(10);
                                doc.text(`tasa de cambio (${tasaDolarGlobal.toFixed(2)})`, doc.internal.pageSize.width - 60, 20);
                                doc.setFontSize(9);
                                doc.text(`Tipo de reporte: ${tipo}`, 14, 35);
                            } else {
                                doc.autoTable({
                                    html: tablaClone,
                                    startY: 45,
                                    theme: 'striped',
                                    headStyles: { fillColor: [59, 123, 192] },
                                    didDrawPage: function (data) {
                                        const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                                        const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();

                                        doc.setFontSize(8);
                                        doc.setTextColor(100);
                                        doc.addImage('logo.png', 'PNG', 14, 10, 25, 25);
                                        doc.text(`Generado por: ${userName}`, pageWidth - 65, pageHeight - 25);
                                        doc.text(`Código: ${userCode}`, pageWidth - 65, pageHeight - 21);
                                        doc.text(`Nro. Control: ${nroControl}`, pageWidth - 65, pageHeight - 17);
                                        doc.text(`Fecha: ${fecha}`, pageWidth - 65, pageHeight - 13);
                                        doc.text(`Hora: ${hora}`, pageWidth - 65, pageHeight - 9);
                                    }
                                });
                            }
                        }
                    } else {
                        doc.autoTable({
                            html: tablaClone,
                            startY: 45,
                            theme: 'striped',
                            headStyles: { fillColor: [59, 123, 192] },
                            didDrawPage: function (data) {
                                const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                                const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();

                                doc.setFontSize(8);
                                doc.setTextColor(100);
                                doc.text(`Generado por: ${userName}`, pageWidth - 65, pageHeight - 25);
                                doc.text(`Código: ${userCode}`, pageWidth - 65, pageHeight - 21);
                                doc.text(`Nro. Control: ${nroControl}`, pageWidth - 65, pageHeight - 17);
                                doc.text(`Fecha: ${fecha}`, pageWidth - 65, pageHeight - 13);
                                doc.text(`Hora: ${hora}`, pageWidth - 65, pageHeight - 9);
                            }
                        });
                    }
                } else {
                    doc.autoTable({
                        html: tablaClone,
                        startY: 45,
                        theme: 'striped',
                        headStyles: { fillColor: [59, 123, 192] },
                        didDrawPage: function (data) {
                            const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                            const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();

                            doc.setFontSize(8);
                            doc.setTextColor(100);
                            doc.text(`Generado por: ${userName}`, pageWidth - 65, pageHeight - 25);
                            doc.text(`Código: ${userCode}`, pageWidth - 65, pageHeight - 21);
                            doc.text(`Nro. Control: ${nroControl}`, pageWidth - 65, pageHeight - 17);
                            doc.text(`Fecha: ${fecha}`, pageWidth - 65, pageHeight - 13);
                            doc.text(`Hora: ${hora}`, pageWidth - 65, pageHeight - 9);
                        }
                    });
                }

                // Numeración de páginas
                const totalPages = doc.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    doc.setPage(i);
                    const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                    const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();
                    doc.text(`(${i}/${totalPages})`, pageWidth / 2 - 10, pageHeight - 5);
                }

                doc.save(`Sildemar_Reporte_${fecha.replace(/\//g, '-')}.pdf`);
                Swal.fire("Exportado", "El PDF ha sido generado correctamente.", "success");
            } catch (error) {
                console.error("Error al exportar PDF:", error);
                Swal.fire("Error", "Ocurrió un error al generar el PDF.", "error");
            }
        }


        // Logout
        document.getElementById('logout-btn').onclick = (e) => {
            e.preventDefault();
            localStorage.removeItem('usuario_actual');
            window.location.href = "../index.html";
        };
    </script>

</body>

</html>
